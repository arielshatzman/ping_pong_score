<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Pro - Voice Elite</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --p1-color: #3498db;
            --p2-color: #e74c3c;
            --accent: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        .container { text-align: center; width: 100%; max-width: 900px; padding: 10px; box-sizing: border-box; }

        .no-sleep-banner {
            background: #333;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center; gap: 8px; cursor: pointer; border: 1px solid #444;
        }
        .no-sleep-banner.active { border-color: var(--accent); color: var(--accent); }

        .voice-controls { margin-bottom: 15px; }

        #voice-btn {
            background: #444; color: white; border: none; padding: 12px 25px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        #voice-btn.active { background: #e74c3c; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .scoreboard { 
            display: flex; gap: 15px; justify-content: center; width: 100%; 
            transition: flex-direction 0.5s ease;
        }
        .player-card { 
            background: var(--card-bg); padding: 25px 10px; border-radius: 20px; 
            flex: 1; max-width: 280px; border: 4px solid transparent; 
            cursor: pointer; display: flex; flex-direction: column; transition: 0.3s; 
        }
        .player-card.serving { border-color: var(--accent); transform: scale(1.05); }

        .player-name { font-size: 1.2rem; font-weight: bold; color: #eee; outline: none; margin-bottom: 5px; border-bottom: 1px dashed #555; }
        .score { font-size: clamp(4.5rem, 18vw, 11rem); font-weight: 900; line-height: 1; margin: 10px 0; font-family: monospace; pointer-events: none; }
        .p1-text { color: var(--p1-color); }
        .p2-text { color: var(--p2-color); }
        .sets-count { font-size: 1.5rem; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 10px; align-self: center; pointer-events: none; }

        .controls { margin-top: 30px; display: flex; gap: 10px; justify-content: center; width: 100%; flex-wrap: wrap; }
        .action-btn { padding: 12px; font-size: 0.9rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; flex: 1; min-width: 100px; max-width: 150px; }
        .btn-undo { background: #444; color: white; }
        .btn-swap { background: #555; color: white; }
        .btn-reset { background: #c0392b; color: white; }

        .status-msg { margin-top: 10px; font-size: 0.85rem; color: #2ecc71; font-weight: bold; min-height: 1.2rem; }
        #hidden-canvas { display: none; }
    </style>
</head>
<body onclick="enableNoSleep()">

    <div class="container">
        <div id="no-sleep-btn" class="no-sleep-banner">
            <span id="no-sleep-icon">⭕</span>
            <span id="no-sleep-text">לחץ להפעלת הגנת מסך</span>
        </div>

        <div class="voice-controls">
            <button id="voice-btn" onclick="toggleVoice()">
                <span id="voice-icon">🎤</span>
                <span id="voice-text">הפעל שליטה קולית</span>
            </button>
            <div class="status-msg" id="status">מוכן...</div>
        </div>

        <div class="scoreboard" id="board">
            <div class="player-card" id="card-1" onclick="handleManualPoint(1)">
                <div class="player-name" id="name-1" contenteditable="true" onclick="event.stopPropagation()">כחול</div>
                <div class="score p1-text" id="score-1">0</div>
                <div class="sets-count" id="sets-1">0</div>
            </div>
            <div class="player-card" id="card-2" onclick="handleManualPoint(2)">
                <div class="player-name" id="name-2" contenteditable="true" onclick="event.stopPropagation()">אדום</div>
                <div class="score p2-text" id="score-2">0</div>
                <div class="sets-count" id="sets-2">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn btn-undo" onclick="undo()">ביטול (חזור)</button>
            <button class="action-btn btn-swap" onclick="swapSides()">החלף צדדים</button>
            <button class="action-btn btn-reset" onclick="resetGame()">איפוס</button>
        </div>
    </div>

    <video id="no-sleep-video" playsinline muted loop style="display:none;"></video>
    <canvas id="hidden-canvas" width="10" height="10"></canvas>

    <script>
        let state = { s1: 0, s2: 0, sets1: 0, sets2: 0 };
        let history = [];
        let isListening = false;
        let isNoSleepActive = false;
        let lastPointTime = 0;
        let isSwapped = false;
        let wakeLock = null;

        // --- הקראת קול ---
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'he-IL';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        // --- מניעת שינה משופרת ---
        async function enableNoSleep() {
            if (isNoSleepActive) return;
            const video = document.getElementById('no-sleep-video');
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            
            setInterval(() => {
                ctx.fillStyle = `rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
                ctx.fillRect(0, 0, 10, 10);
            }, 1000);

            const stream = canvas.captureStream(10);
            video.srcObject = stream;

            try {
                await video.play();
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
                isNoSleepActive = true;
                document.getElementById('no-sleep-btn').classList.add('active');
                document.getElementById('no-sleep-text').innerText = "הגנת מסך פעילה";
            } catch (e) {}
        }

        function swapSides() {
            isSwapped = !isSwapped;
            const board = document.getElementById('board');
            board.style.flexDirection = isSwapped ? 'row-reverse' : 'row';
            speak("החלפת צדדים");
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript.trim().toLowerCase();
                    document.getElementById('status').innerText = 'שומע: ' + transcript;

                    if (!event.results[i].isFinal) continue;

                    // פקודת שינוי שם: "שנה שם של כחול ליוסי"
                    if (transcript.includes("שם") && transcript.includes(" ל")) {
                        let targetPlayer = 0;
                        if (transcript.includes("כחול") || transcript.includes("1") || transcript.includes("אחד")) targetPlayer = 1;
                        else if (transcript.includes("אדום") || transcript.includes("2") || transcript.includes("שתיים")) targetPlayer = 2;

                        if (targetPlayer > 0) {
                            const parts = transcript.split(" ל");
                            const newName = parts[parts.length - 1].trim();
                            if (newName) {
                                document.getElementById('name-' + targetPlayer).innerText = newName;
                                speak("שונה ל" + newName);
                                recognition.stop();
                                return;
                            }
                        }
                    }

                    // פקודות ניווט
                    if (transcript.match(/(החלף צד|צדדים|תחליף)/)) { swapSides(); recognition.stop(); break; }
                    if (transcript.match(/(ביטול|טעות|חזור|ביטו)/)) { undo(); recognition.stop(); break; } 

                    // נקודות לפי שמות נוכחיים או צבעים
                    const name1 = document.getElementById('name-1').innerText.trim().toLowerCase();
                    const name2 = document.getElementById('name-2').innerText.trim().toLowerCase();

                    if (transcript.includes(name1) || transcript.match(/(כחול|חול|כחו|כח)/)) { addPoint(1); recognition.stop(); break; } 
                    if (transcript.includes(name2) || transcript.match(/(אדום|דום|אדו|אד)/)) { addPoint(2); recognition.stop(); break; }
                }
            };
            recognition.onend = () => { if (isListening) recognition.start(); };
        }

        function toggleVoice() {
            enableNoSleep();
            if (!recognition) return alert("אין תמיכה בקול");
            isListening = !isListening;
            if (isListening) {
                recognition.start();
                document.getElementById('voice-btn').classList.add('active');
            } else {
                recognition.stop();
                document.getElementById('voice-btn').classList.remove('active');
            }
        }

        function handleManualPoint(p) {
            enableNoSleep();
            addPoint(p);
        }

        function addPoint(player) {
            const now = Date.now();
            if (now - lastPointTime < 1000) return;
            lastPointTime = now;

            history.push({...state});
            if (player === 1) state.s1++; else state.s2++;
            
            updateUI();
            speak(`${state.s1} ${state.s2}`);
            checkWin();
        }

        function undo() {
            if (history.length > 0) {
                state = history.pop();
                updateUI();
                speak("בוצע ביטול");
            }
        }

        function updateUI() {
            document.getElementById('score-1').innerText = state.s1;
            document.getElementById('score-2').innerText = state.s2;
            document.getElementById('sets-1').innerText = state.sets1;
            document.getElementById('sets-2').innerText = state.sets2;
            
            const total = state.s1 + state.s2;
            let server = (state.s1 >= 10 && state.s2 >= 10) ? (total % 2 === 0 ? 1 : 2) : (Math.floor(total / 2) % 2 === 0 ? 1 : 2);
            document.getElementById('card-1').classList.toggle('serving', server === 1);
            document.getElementById('card-2').classList.toggle('serving', server === 2);
        }

        function checkWin() {
            let winner = 0;
            const n1 = document.getElementById('name-1').innerText;
            const n2 = document.getElementById('name-2').innerText;

            if (state.s1 >= 11 && (state.s1 - state.s2) >= 2) winner = 1;
            else if (state.s2 >= 11 && (state.s2 - state.s1) >= 2) winner = 2;
            else if (state.s1 === 7 && state.s2 === 0) winner = 1;
            else if (state.s2 === 7 && state.s1 === 0) winner = 2;

            if (winner > 0) {
                const winnerName = winner === 1 ? n1 : n2;
                if (winner === 1) state.sets1++; else state.sets2++;
                
                speak(`מערכה נגמרה. ${winnerName} ניצח.`);
                
                setTimeout(() => {
                    alert(`המערכה נגמרה! המנצח: ${winnerName}`);
                    state.s1 = 0; state.s2 = 0;
                    updateUI();
                }, 100);
            }
        }

        function resetGame() {
            if(confirm("לאפס את הניקוד?")) {
                state = { s1: 0, s2: 0, sets1: 0, sets2: 0 };
                history = [];
                updateUI();
                speak("המשחק אופס");
            }
        }

        updateUI();
    </script>
</body>
</html>
