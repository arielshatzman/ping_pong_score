<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Pro - Always On</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --p1-color: #3498db;
            --p2-color: #e74c3c;
            --accent: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .container { text-align: center; width: 100%; max-width: 900px; padding: 10px; box-sizing: border-box; }

        .voice-controls { margin-bottom: 15px; }

        #voice-btn {
            background: #444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        #voice-btn.active {
            background: #e74c3c;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .game-mode-toggle { margin-bottom: 15px; background: #333; padding: 5px; border-radius: 15px; display: inline-flex; }
        .mode-btn { padding: 8px 12px; border-radius: 10px; cursor: pointer; border: none; background: transparent; color: #888; font-weight: bold; font-size: 0.9rem; }
        .mode-btn.active { background: var(--accent); color: black; }

        .scoreboard { display: flex; gap: 15px; justify-content: center; width: 100%; }
        .player-card { background: var(--card-bg); padding: 20px 10px; border-radius: 20px; flex: 1; max-width: 280px; transition: 0.2s; border: 4px solid transparent; cursor: pointer; display: flex; flex-direction: column; position: relative; }
        .player-card.serving { border-color: var(--accent); }

        .player-name { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #eee; outline: none; }
        .score { font-size: clamp(4rem, 15vw, 10rem); font-weight: 900; line-height: 1; margin: 10px 0; font-family: monospace; }
        #score-1 { color: var(--p1-color); }
        #score-2 { color: var(--p2-color); }
        .sets-count { font-size: 1.5rem; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 10px; align-self: center; }

        .controls { margin-top: 30px; display: flex; gap: 10px; justify-content: center; width: 100%; }
        .action-btn { padding: 12px 25px; font-size: 1rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; flex: 1; max-width: 150px; }
        .btn-undo { background: #444; color: white; }
        .btn-reset { background: #c0392b; color: white; }

        .status-msg { margin-top: 10px; font-size: 0.8rem; color: #aaa; height: 1.2rem; }
        
        /* חיווי שהמסך "נעול" דולק */
        .wake-lock-status { font-size: 0.7rem; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="voice-controls">
            <button id="voice-btn" onclick="toggleVoice()">
                <span id="voice-icon">🎤</span>
                <span id="voice-text">הפעל שליטה קולית</span>
            </button>
            <div class="status-msg" id="status">תגידו "כחול", "אדום" או "ביטול"</div>
        </div>

        <div class="game-mode-toggle">
            <button id="mode-normal" class="mode-btn active" onclick="setMode('normal')">רגיל (11)</button>
            <button id="mode-short" class="mode-btn" onclick="setMode('short')">קצר (5)</button>
        </div>

        <div class="scoreboard">
            <div class="player-card" id="card-1" onclick="addPoint(1)">
                <div class="player-name" contenteditable="true" onclick="event.stopPropagation()">כחול</div>
                <div class="score" id="score-1">0</div>
                <div class="sets-count" id="sets-1">0</div>
            </div>
            <div class="player-card" id="card-2" onclick="addPoint(2)">
                <div class="player-name" contenteditable="true" onclick="event.stopPropagation()">אדום</div>
                <div class="score" id="score-2">0</div>
                <div class="sets-count" id="sets-2">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn btn-undo" onclick="undo()">ביטול</button>
            <button class="action-btn btn-reset" onclick="resetGame()">איפוס</button>
        </div>
        
        <div class="wake-lock-status" id="wake-status">הגנה מפני כיבוי מסך פעילה</div>
    </div>

    <script>
        let state = { s1: 0, s2: 0, sets1: 0, sets2: 0 };
        let history = [];
        let gameMode = 'normal';
        let isListening = false;
        let wakeLock = null;

        // --- מניעת כיבוי מסך ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock is active');
                    document.getElementById('wake-status').innerText = "✔️ המסך לא יכבה בזמן המשחק";
                    
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock was released');
                    });
                }
            } catch (err) {
                document.getElementById('wake-status').innerText = "❌ המכשיר לא תומך במניעת כיבוי מסך אוטומטי";
            }
        }

        // הפעלה מחדש של הנעילה אם המשתמש חזר ללשונית
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // בקשת הנעילה מיד עם הלחיצה הראשונה על המסך (דפדפנים דורשים אינטראקציה)
        document.addEventListener('click', () => {
            if (!wakeLock) requestWakeLock();
        }, { once: true });

        // --- זיהוי קולי ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                document.getElementById('status').innerText = 'שמעתי: "' + transcript + '"';
                
                const name1 = document.querySelectorAll('.player-name')[0].innerText.trim().toLowerCase();
                const name2 = document.querySelectorAll('.player-name')[1].innerText.trim().toLowerCase();

                if (transcript.includes('ביטול') || transcript.includes('טעות')) {
                    undo();
                } else if (transcript.includes(name1) || transcript.includes('כחול')) {
                    addPoint(1);
                } else if (transcript.includes(name2) || transcript.includes('אדום')) {
                    addPoint(2);
                }
            };

            recognition.onend = () => { if (isListening) recognition.start(); };
        }

        function toggleVoice() {
            if (!recognition) { alert("הדפדפן לא תומך בזיהוי קולי."); return; }
            if (!isListening) {
                recognition.start();
                isListening = true;
                document.getElementById('voice-btn').classList.add('active');
                document.getElementById('voice-text').innerText = "מקשיב...";
            } else {
                recognition.stop();
                isListening = false;
                document.getElementById('voice-btn').classList.remove('active');
                document.getElementById('voice-text').innerText = "הפעל שליטה קולית";
            }
        }

        function addPoint(player) {
            history.push({...state});
            if (player === 1) state.s1++; else state.s2++;
            updateUI();
            checkWinConditions();
        }

        function undo() {
            if (history.length > 0) {
                state = history.pop();
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('score-1').innerText = state.s1;
            document.getElementById('score-2').innerText = state.s2;
            document.getElementById('sets-1').innerText = state.sets1;
            document.getElementById('sets-2').innerText = state.sets2;
            
            const total = state.s1 + state.s2;
            let target = gameMode === 'short' ? 4 : 10;
            let server = (state.s1 >= target && state.s2 >= target) ? (total % 2 === 0 ? 1 : 2) : (Math.floor(total / 2) % 2 === 0 ? 1 : 2);
            
            document.getElementById('card-1').classList.toggle('serving', server === 1);
            document.getElementById('card-2').classList.toggle('serving', server === 2);
        }

        function checkWinConditions() {
            let target = gameMode === 'short' ? 5 : 11;
            let winner = 0;
            if (state.s1 >= target && (state.s1 - state.s2) >= 2) winner = 1;
            else if (state.s2 >= target && (state.s2 - state.s1) >= 2) winner = 2;

            if (winner > 0) {
                if (winner === 1) state.sets1++; else state.sets2++;
                setTimeout(() => {
                    alert("מערכה נגמרה!");
                    state.s1 = 0; state.s2 = 0;
                    updateUI();
                }, 100);
            }
        }

        function setMode(mode) { gameMode = mode; resetGame(false); }
        function resetGame(ask = true) { if(!ask || confirm("לאפס?")) { state = { s1: 0, s2: 0, sets1: 0, sets2: 0 }; history = []; updateUI(); } }

        updateUI();
    </script>
</body>
</html>
