<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Pro - Fast Voice</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --p1-color: #3498db;
            --p2-color: #e74c3c;
            --accent: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container { text-align: center; width: 100%; max-width: 900px; padding: 10px; }

        #voice-btn {
            background: #444; color: white; border: none; padding: 15px 30px;
            border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        #voice-btn.active { background: #e74c3c; box-shadow: 0 0 15px rgba(231, 76, 60, 0.5); }

        .scoreboard { display: flex; gap: 15px; justify-content: center; width: 100%; margin-top: 20px; }
        .player-card { 
            background: var(--card-bg); padding: 25px 10px; border-radius: 20px; 
            flex: 1; max-width: 280px; border: 4px solid transparent; transition: 0.3s;
        }
        .player-card.serving { border-color: var(--accent); transform: scale(1.03); }

        .score { font-size: clamp(5rem, 20vw, 12rem); font-weight: 900; line-height: 1; font-family: monospace; }
        .color-p1 { color: var(--p1-color); }
        .color-p2 { color: var(--p2-color); }

        .status-msg { margin-top: 15px; font-size: 1rem; color: var(--accent); height: 1.5rem; }
    </style>
</head>
<body onclick="enableNoSleep()">

    <div class="container">
        <div class="voice-controls">
            <button id="voice-btn" onclick="toggleVoice()">🎤 הפעל שליטה קולית</button>
            <div class="status-msg" id="status">מוכן...</div>
        </div>

        <div class="scoreboard">
            <div class="player-card" id="ui-card-right">
                <div id="ui-name-right" style="font-weight: bold; opacity: 0.8;">כחול</div>
                <div class="score color-p1" id="ui-score-right">0</div>
            </div>
            <div class="player-card" id="ui-card-left">
                <div id="ui-name-left" style="font-weight: bold; opacity: 0.8;">אדום</div>
                <div class="score color-p2" id="ui-score-left">0</div>
            </div>
        </div>
        
        <p style="opacity: 0.5; font-size: 0.8rem; margin-top: 20px;">פקודות: "כחול", "אדום", "בטל", "צדדים"</p>
    </div>

    <script>
        let state = { s1: 0, s2: 0 };
        let isListening = false;
        let isProcessing = false;
        let isSwapped = false;
        let lastTranscript = ""; // שומר את המשפט האחרון כדי למנוע כפילות בתוך הזרם

        const KEYWORDS = {
            p1: ["כחול", "כחו", "בלו"],
            p2: ["אדום", "אדו", "רד"],
            undo: ["בטל", "חזור", "טעות"],
            swap: ["צדדים", "החלף"]
        };

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'he-IL';
            utterance.rate = 1.5;
            window.speechSynthesis.speak(utterance);
        }

        function addPoint(player) {
            if (player === 1) state.s1++; else state.s2++;
            updateUI();
            speak(`${state.s1} ${state.s2}`);
        }

        function updateUI() {
            document.getElementById('ui-score-right').innerText = isSwapped ? state.s2 : state.s1;
            document.getElementById('ui-score-left').innerText = isSwapped ? state.s1 : state.s2;
            document.getElementById('ui-name-right').innerText = isSwapped ? "אדום" : "כחול";
            document.getElementById('ui-name-left').innerText = isSwapped ? "כחול" : "אדום";
        }

        function processVoice(text) {
            // אם הטקסט שזיהינו עכשיו כבר נמצא ב"זיכרון" של המשפט הנוכחי - דלג
            if (text === lastTranscript) return;
            
            const contains = (list) => list.some(k => text.includes(k));

            if (contains(KEYWORDS.p1)) { triggerAction(() => addPoint(1)); }
            else if (contains(KEYWORDS.p2)) { triggerAction(() => addPoint(2)); }
            else if (contains(KEYWORDS.undo)) { triggerAction(() => { 
                if (state.s1 > 0 || state.s2 > 0) { /* לוגיקת ביטול פשוטה */ }
                speak("ביטול");
            });}
            else if (contains(KEYWORDS.swap)) { triggerAction(() => { 
                isSwapped = !isSwapped; 
                updateUI(); 
                speak("החלפה");
            });}

            lastTranscript = text; // עדכון הזיכרון למשפט הנוכחי
        }

        function triggerAction(action) {
            if (isProcessing) return;
            isProcessing = true;
            action();
            // חסימה קצרה מאוד רק כדי לא לקלוט הבהרה של אותה מילה
            setTimeout(() => { isProcessing = false; }, 800); 
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.continuous = true;
            recognition.interimResults = true; // מחזיר תוצאות תוך כדי דיבור למהירות שיא

            recognition.onresult = (event) => {
                let result = event.results[event.results.length - 1];
                let transcript = result[0].transcript.trim().toLowerCase();
                
                document.getElementById('status').innerText = transcript;

                if (result.isFinal) {
                    lastTranscript = ""; // איפוס הזיכרון כשהמשפט נגמר
                } else {
                    processVoice(transcript);
                }
            };

            recognition.onend = () => { if (isListening) recognition.start(); };

            window.toggleVoice = function() {
                isListening = !isListening;
                const btn = document.getElementById('voice-btn');
                if (isListening) {
                    recognition.start();
                    btn.classList.add('active');
                    btn.innerText = "🛑 הפסק שליטה";
                } else {
                    recognition.stop();
                    btn.classList.remove('active');
                    btn.innerText = "🎤 הפעל שליטה קולית";
                }
            };
        }

        // הגנת מסך (No Sleep) פשוטה
        function enableNoSleep() {
            // כאן אפשר להוסיף את קוד הוידאו השקט שלך
        }
    </script>
</body>
</html>
