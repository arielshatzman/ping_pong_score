<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Pro - Fast Voice</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --p1-color: #3498db;
            --p2-color: #e74c3c;
            --accent: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        .container { text-align: center; width: 100%; max-width: 900px; padding: 10px; box-sizing: border-box; }

        .no-sleep-banner {
            background: #333;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: 1px solid #444;
            transition: 0.3s;
        }
        .no-sleep-banner.active { border-color: var(--accent); color: var(--accent); }

        .voice-controls { margin-bottom: 15px; }

        #voice-btn {
            background: #444;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        #voice-btn.active { background: #e74c3c; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .game-mode-toggle { margin-bottom: 15px; background: #333; padding: 5px; border-radius: 15px; display: inline-flex; }
        .mode-btn { padding: 8px 12px; border-radius: 10px; cursor: pointer; border: none; background: transparent; color: #888; font-weight: bold; font-size: 0.8rem; }
        .mode-btn.active { background: var(--accent); color: black; }

        .scoreboard { display: flex; gap: 15px; justify-content: center; width: 100%; }
        .player-card { background: var(--card-bg); padding: 25px 10px; border-radius: 20px; flex: 1; max-width: 280px; border: 4px solid transparent; cursor: pointer; display: flex; flex-direction: column; transition: 0.2s; }
        .player-card.serving { border-color: var(--accent); transform: scale(1.02); }

        .player-name { font-size: 1.2rem; font-weight: bold; color: #eee; outline: none; margin-bottom: 5px; border-bottom: 1px dashed #555; }
        .score { font-size: clamp(4.5rem, 18vw, 11rem); font-weight: 900; line-height: 1; margin: 10px 0; font-family: monospace; pointer-events: none; }
        #score-1 { color: var(--p1-color); }
        #score-2 { color: var(--p2-color); }
        .sets-count { font-size: 1.5rem; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 10px; align-self: center; pointer-events: none; }

        .controls { margin-top: 30px; display: flex; gap: 10px; justify-content: center; width: 100%; }
        .action-btn { padding: 15px; font-size: 1rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; flex: 1; max-width: 150px; }
        .btn-undo { background: #444; color: white; }
        .btn-reset { background: #c0392b; color: white; }

        .status-msg { margin-top: 10px; font-size: 0.85rem; color: #2ecc71; font-weight: bold; min-height: 1.2rem; }
    </style>
</head>
<body>

    <div class="container">
        <div id="no-sleep-btn" class="no-sleep-banner" onclick="enableNoSleep()">
            <span id="no-sleep-icon">⭕</span>
            <span id="no-sleep-text">לחץ למניעת כיבוי מסך</span>
        </div>

        <div class="voice-controls">
            <button id="voice-btn" onclick="toggleVoice()">
                <span id="voice-icon">🎤</span>
                <span id="voice-text">הפעל שליטה קולית</span>
            </button>
            <div class="status-msg" id="status">מוכן לשמוע...</div>
        </div>

        <div class="game-mode-toggle">
            <button id="mode-normal" class="mode-btn active" onclick="setMode('normal')">רגיל (11)</button>
            <button id="mode-short" class="mode-btn" onclick="setMode('short')">קצר (5)</button>
        </div>

        <div class="scoreboard">
            <div class="player-card" id="card-1" onclick="handleManualPoint(1)">
                <div class="player-name" contenteditable="true" onclick="event.stopPropagation()">כחול</div>
                <div class="score" id="score-1">0</div>
                <div class="sets-count" id="sets-1">0</div>
            </div>
            <div class="player-card" id="card-2" onclick="handleManualPoint(2)">
                <div class="player-name" contenteditable="true" onclick="event.stopPropagation()">אדום</div>
                <div class="score" id="score-2">0</div>
                <div class="sets-count" id="sets-2">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn btn-undo" onclick="undo()">ביטול</button>
            <button class="action-btn btn-reset" onclick="resetGame()">איפוס</button>
        </div>
    </div>

    <video id="no-sleep-video" playsinline muted loop style="display:none;"></video>

    <script>
        let state = { s1: 0, s2: 0, sets1: 0, sets2: 0 };
        let history = [];
        let gameMode = 'normal';
        let isListening = false;
        let isNoSleepActive = false;

        // --- מניעת כיבוי מסך ---
        async function enableNoSleep() {
            if (isNoSleepActive) return;
            const video = document.getElementById('no-sleep-video');
            video.src = "data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAAZptb292AAAAbG12aGQAAAAA389v6N/Pb+gAAAPoAAAAKAABAAABAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAAAGWlvZHMAAAAAEAAf/yADAAABAAAAAAAZdHJhawAAAFx0a2hkAAAAAd/Pb+jfz2/oAAAAAQAAAAAAAAPoAAAAAAAAAAAAAAAAAQAAAAABAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAW1kaWEAAAAgbWRoZAAAAADfz2/o389v6AAA6GAAAAABAAAAAAAAAC1oZGxyAAAAAAAAAAB2aWRlAAAAAAAAAAAAAAAAVmlkZW9IYW5kbGVyAAAAAVxtaW5mAAAAEHZtZGhkAAAAAQAAAAAAAAA0ZGluZgAAABxkcmVmAAAAAAAAAAEAAAAMdXJsIAAAAAEAAAFSbXN0YmwAAABidmN3MAAAAABBVU8AAAAAAAAA6GAAAAAA";
            try {
                await video.play();
                if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
                isNoSleepActive = true;
                document.getElementById('no-sleep-btn').classList.add('active');
                document.getElementById('no-sleep-icon').innerText = "✔️";
                document.getElementById('no-sleep-text').innerText = "הגנת מסך פעילה";
            } catch (e) {}
        }

        function handleManualPoint(p) {
            enableNoSleep();
            addPoint(p);
        }

        // --- זיהוי קולי מהיר ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.continuous = true;
            recognition.interimResults = true; // זיהוי תוך כדי דיבור

            recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript.trim().toLowerCase();
                    document.getElementById('status').innerText = 'שמעתי: ' + transcript;

                    const name1 = document.querySelectorAll('.player-name')[0].innerText.trim().toLowerCase();
                    const name2 = document.querySelectorAll('.player-name')[1].innerText.trim().toLowerCase();

                    if (transcript.includes('ביטול') || transcript.includes('טעות')) {
                        undo();
                        recognition.stop(); 
                        break;
                    } 
                    if (transcript.includes(name1) || transcript.includes('כחול')) {
                        addPoint(1);
                        recognition.stop();
                        break;
                    } 
                    if (transcript.includes(name2) || transcript.includes('אדום')) {
                        addPoint(2);
                        recognition.stop();
                        break;
                    }
                }
            };
            recognition.onend = () => { if (isListening) recognition.start(); };
        }

        function toggleVoice() {
            enableNoSleep();
            if (!recognition) return alert("אין תמיכה בקול");
            if (!isListening) {
                recognition.start();
                isListening = true;
                document.getElementById('voice-btn').classList.add('active');
                document.getElementById('voice-text').innerText = "מקשיב...";
            } else {
                isListening = false;
                recognition.stop();
                document.getElementById('voice-btn').classList.remove('active');
                document.getElementById('voice-text').innerText = "הפעל שליטה קולית";
            }
        }

        function addPoint(player) {
            history.push({...state});
            if (player === 1) state.s1++; else state.s2++;
            updateUI();
            checkWin();
        }

        function undo() {
            if (history.length > 0) {
                state = history.pop();
                updateUI();
                document.getElementById('status').innerText = "בוצע ביטול";
            }
        }

        function updateUI() {
            document.getElementById('score-1').innerText = state.s1;
            document.getElementById('score-2').innerText = state.s2;
            document.getElementById('sets-1').innerText = state.sets1;
            document.getElementById('sets-2').innerText = state.sets2;
            
            const total = state.s1 + state.s2;
            const target = gameMode === 'short' ? 4 : 10;
            let server = (state.s1 >= target && state.s2 >= target) ? (total % 2 === 0 ? 1 : 2) : (Math.floor(total / 2) % 2 === 0 ? 1 : 2);
            document.getElementById('card-1').classList.toggle('serving', server === 1);
            document.getElementById('card-2').classList.toggle('serving', server === 2);
        }

        function checkWin() {
            let target = gameMode === 'short' ? 5 : 11;
            let winner = 0;
            
            // טכני ב-7:0 רק במצב רגיל
            if (gameMode === 'normal') {
                if (state.s1 === 7 && state.s2 === 0) winner = 1;
                else if (state.s2 === 7 && state.s1 === 0) winner = 2;
            }

            if (winner === 0) {
                if (state.s1 >= target && (state.s1 - state.s2) >= 2) winner = 1;
                else if (state.s2 >= target && (state.s2 - state.s1) >= 2) winner = 2;
            }

            if (winner > 0) {
                if (winner === 1) state.sets1++; else state.sets2++;
                setTimeout(() => {
                    alert("המערכה נגמרה!");
                    state.s1 = 0; state.s2 = 0;
                    updateUI();
                }, 50);
            }
        }

        function setMode(mode) { 
            gameMode = mode; 
            document.getElementById('mode-normal').classList.toggle('active', mode === 'normal');
            document.getElementById('mode-short').classList.toggle('active', mode === 'short');
            resetGame(false); 
        }

        function resetGame(ask = true) {
            if(!ask || confirm("לאפס את הניקוד?")) {
                state = { s1: 0, s2: 0, sets1: 0, sets2: 0 };
                history = [];
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
