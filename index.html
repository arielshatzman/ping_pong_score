<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Pro Scoreboard</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --p1-color: #3498db;
            --p2-color: #e74c3c;
            --accent: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            touch-action: manipulation; /* מונע זום בטעות בלחיצות מהירות */
        }

        .container { 
            text-align: center; 
            width: 100%; 
            max-width: 900px; 
            padding: 10px;
            box-sizing: border-box;
        }

        .game-mode-toggle {
            margin-bottom: 20px;
            background: #333;
            padding: 5px;
            border-radius: 15px;
            display: inline-flex;
            gap: 5px;
        }

        .mode-btn {
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #888;
            font-weight: bold;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .mode-btn.active {
            background: var(--accent);
            color: black;
        }

        .sets-header {
            font-size: 1rem;
            color: #888;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .scoreboard {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: stretch;
            width: 100%;
        }

        .player-card {
            background: var(--card-bg);
            padding: 20px 10px;
            border-radius: 20px;
            flex: 1; /* יתחלק שווה בשווה ברוחב */
            max-width: 280px;
            position: relative;
            transition: all 0.2s ease;
            border: 4px solid transparent;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .player-card.serving {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
        }

        .player-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #eee;
            outline: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score {
            font-size: clamp(5rem, 15vw, 10rem); /* גודל טקסט גמיש לפי רוחב המסך */
            font-weight: 900;
            line-height: 1;
            margin: 10px 0;
            font-family: 'Courier New', Courier, monospace;
        }

        #score-1 { color: var(--p1-color); }
        #score-2 { color: var(--p2-color); }

        .sets-count {
            font-size: 1.5rem;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 10px;
            color: white;
            align-self: center;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        button.action-btn {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            flex: 1;
            max-width: 150px;
        }

        .btn-undo { background: #444; color: white; }
        .btn-reset { background: #c0392b; color: white; }

        .instructions {
            margin-top: 20px;
            color: #666;
            font-size: 0.75rem;
        }

        /* התאמה למסכים קטנים מאוד */
        @media (max-width: 400px) {
            .scoreboard { gap: 8px; }
            .player-card { padding: 15px 5px; }
            .score { margin: 5px 0; }
        }

        .skunk-alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: gold;
            color: black;
            padding: 30px;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 100;
            transition: 0.4s;
            text-align: center;
            box-shadow: 0 0 100px rgba(255, 215, 0, 0.5);
            width: 80%;
        }
        .skunk-alert.show { transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>

    <div class="skunk-alert" id="skunk-box">
        טכני! 🦨<br>פירקו אותך 7-0!
    </div>

    <div class="container">
        <div class="game-mode-toggle">
            <button id="mode-normal" class="mode-btn active" onclick="setMode('normal')">רגיל (11)</button>
            <button id="mode-short" class="mode-btn" onclick="setMode('short')">קצר (5)</button>
        </div>

        <div class="sets-header">מערכות (SETS)</div>
        
        <div class="scoreboard">
            <div class="player-card" id="card-1" onclick="addPoint(1)">
                <div class="player-name" contenteditable="true" onclick="event.stopPropagation()">שחקן 1</div>
                <div class="score" id="score-1">0</div>
                <div class="sets-count" id="sets-1">0</div>
            </div>

            <div class="player-card" id="card-2" onclick="addPoint(2)">
                <div class="player-name" contenteditable="true" onclick="event.stopPropagation()">שחקן 2</div>
                <div class="score" id="score-2">0</div>
                <div class="sets-count" id="sets-2">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn btn-undo" onclick="undo()">ביטול (Z)</button>
            <button class="action-btn btn-reset" onclick="resetGame()">איפוס</button>
        </div>

        <div class="instructions">
            Q לשחקן ימין | P לשחקן שמאל | Z לביטול
        </div>
    </div>

    <script>
        let state = { s1: 0, s2: 0, sets1: 0, sets2: 0 };
        let history = [];
        let gameMode = 'normal';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function setMode(mode) {
            gameMode = mode;
            document.getElementById('mode-normal').classList.toggle('active', mode === 'normal');
            document.getElementById('mode-short').classList.toggle('active', mode === 'short');
            resetGame(false);
        }

        function updateUI() {
            document.getElementById('score-1').innerText = state.s1;
            document.getElementById('score-2').innerText = state.s2;
            document.getElementById('sets-1').innerText = state.sets1;
            document.getElementById('sets-2').innerText = state.sets2;

            const total = state.s1 + state.s2;
            let server = (state.s1 >= (gameMode === 'short' ? 4 : 10) && state.s2 >= (gameMode === 'short' ? 4 : 10)) ? 
                         (total % 2 === 0 ? 1 : 2) : 
                         (Math.floor(total / 2) % 2 === 0 ? 1 : 2);

            document.getElementById('card-1').classList.toggle('serving', server === 1);
            document.getElementById('card-2').classList.toggle('serving', server === 2);
        }

        function addPoint(player) {
            history.push({...state});
            if (player === 1) state.s1++; else state.s2++;
            playSound(500);
            updateUI();
            checkWinConditions();
        }

        function undo() {
            if (history.length > 0) {
                state = history.pop();
                updateUI();
            }
        }

        function checkWinConditions() {
            let targetScore = gameMode === 'short' ? 5 : 11;
            let winner = 0;
            let isSkunk = false;

            if (gameMode === 'normal') {
                if (state.s1 === 7 && state.s2 === 0) { winner = 1; isSkunk = true; }
                else if (state.s2 === 7 && state.s1 === 0) { winner = 2; isSkunk = true; }
            }
            
            if (winner === 0) {
                if (state.s1 >= targetScore && (state.s1 - state.s2) >= 2) { winner = 1; }
                else if (state.s2 >= targetScore && (state.s2 - state.s1) >= 2) { winner = 2; }
            }

            if (winner > 0) {
                if (winner === 1) state.sets1++; else state.sets2++;
                
                if (isSkunk) {
                    showSkunkAlert();
                } else {
                    playSound(800, 0.4);
                    setTimeout(() => alert("המערכה נגמרה!"), 100);
                }

                state.s1 = 0;
                state.s2 = 0;
                setTimeout(updateUI, 500);
            }
        }

        function showSkunkAlert() {
            const alertBox = document.getElementById('skunk-box');
            playSound(300, 0.5);
            alertBox.classList.add('show');
            setTimeout(() => alertBox.classList.remove('show'), 2500);
        }

        function resetGame(ask = true) {
            if(!ask || confirm("לאפס את המשחק?")) {
                state = { s1: 0, s2: 0, sets1: 0, sets2: 0 };
                history = [];
                updateUI();
            }
        }

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'q') addPoint(1);
            if (key === 'p') addPoint(2);
            if (key === 'z') undo();
        });

        updateUI();
    </script>
</body>
</html>
