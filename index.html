<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Pro - No Sleep</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --p1-color: #3498db;
            --p2-color: #e74c3c;
            --accent: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .container { text-align: center; width: 100%; max-width: 900px; padding: 10px; box-sizing: border-box; }

        /* כפתור למניעת שינה */
        .no-sleep-banner {
            background: #333;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: 1px solid #444;
        }
        .no-sleep-banner.active { border-color: var(--accent); color: var(--accent); }

        .voice-controls { margin-bottom: 15px; }

        #voice-btn {
            background: #444;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        #voice-btn.active { background: #e74c3c; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .scoreboard { display: flex; gap: 15px; justify-content: center; width: 100%; }
        .player-card { background: var(--card-bg); padding: 25px 10px; border-radius: 20px; flex: 1; max-width: 280px; border: 4px solid transparent; cursor: pointer; display: flex; flex-direction: column; }
        .player-card.serving { border-color: var(--accent); }

        .player-name { font-size: 1.2rem; font-weight: bold; color: #eee; outline: none; margin-bottom: 5px; }
        .score { font-size: clamp(4.5rem, 18vw, 11rem); font-weight: 900; line-height: 1; margin: 10px 0; font-family: monospace; }
        #score-1 { color: var(--p1-color); }
        #score-2 { color: var(--p2-color); }
        .sets-count { font-size: 1.5rem; background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 10px; align-self: center; }

        .controls { margin-top: 30px; display: flex; gap: 10px; justify-content: center; width: 100%; }
        .action-btn { padding: 15px; font-size: 1rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; flex: 1; max-width: 150px; }
        .btn-undo { background: #444; color: white; }
        .btn-reset { background: #c0392b; color: white; }

        .status-msg { margin-top: 10px; font-size: 0.8rem; color: #888; min-height: 1.2rem; }
    </style>
</head>
<body>

    <div class="container">
        <div id="no-sleep-btn" class="no-sleep-banner" onclick="enableNoSleep()">
            <span id="no-sleep-icon">⭕</span>
            <span id="no-sleep-text">לחץ כאן כדי שהמסך לא יכבה</span>
        </div>

        <div class="voice-controls">
            <button id="voice-btn" onclick="toggleVoice()">
                <span id="voice-icon">🎤</span>
                <span id="voice-text">הפעל שליטה קולית</span>
            </button>
            <div class="status-msg" id="status">תגידו "כחול", "אדום" או "ביטול"</div>
        </div>

        <div class="scoreboard">
            <div class="player-card" id="card-1" onclick="handleCardClick(1)">
                <div class="player-name" contenteditable="true" onclick="event.stopPropagation()">כחול</div>
                <div class="score" id="score-1">0</div>
                <div class="sets-count" id="sets-1">0</div>
            </div>
            <div class="player-card" id="card-2" onclick="handleCardClick(2)">
                <div class="player-name" contenteditable="true" onclick="event.stopPropagation()">אדום</div>
                <div class="score" id="score-2">0</div>
                <div class="sets-count" id="sets-2">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn btn-undo" onclick="undo()">ביטול</button>
            <button class="action-btn btn-reset" onclick="resetGame()">איפוס</button>
        </div>
    </div>

    <video id="no-sleep-video" playsinline muted loop style="display:none;"></video>

    <script>
        let state = { s1: 0, s2: 0, sets1: 0, sets2: 0 };
        let history = [];
        let isListening = false;
        let isNoSleepActive = false;

        // --- פונקציית מניעת שינה (וידאו + WakeLock) ---
        async function enableNoSleep() {
            if (isNoSleepActive) return;

            // 1. נסיון ל-Wake Lock API
            if ('wakeLock' in navigator) {
                try {
                    await navigator.wakeLock.request('screen');
                } catch (e) {}
            }

            // 2. הפעלת וידאו נסתר (עובד מעולה ב-iOS ו-Android)
            const video = document.getElementById('no-sleep-video');
            // יצירת וידאו ריק קטנטן ב-Base64
            video.src = "data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAAZptb292AAAAbG12aGQAAAAA389v6N/Pb+gAAAPoAAAAKAABAAABAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAAAGWlvZHMAAAAAEAAf/yADAAABAAAAAAAZdHJhawAAAFx0a2hkAAAAAd/Pb+jfz2/oAAAAAQAAAAAAAAPoAAAAAAAAAAAAAAAAAQAAAAABAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAW1kaWEAAAAgbWRoZAAAAADfz2/o389v6AAA6GAAAAABAAAAAAAAAC1oZGxyAAAAAAAAAAB2aWRlAAAAAAAAAAAAAAAAVmlkZW9IYW5kbGVyAAAAAVxtaW5mAAAAEHZtZGhkAAAAAQAAAAAAAAA0ZGluZgAAABxkcmVmAAAAAAAAAAEAAAAMdXJsIAAAAAEAAAFSbXN0YmwAAABidmN3MAAAAABBVU8AAAAAAAAA6GAAAAAA";
            
            video.play().then(() => {
                isNoSleepActive = true;
                const btn = document.getElementById('no-sleep-btn');
                btn.classList.add('active');
                document.getElementById('no-sleep-icon').innerText = "✔️";
                document.getElementById('no-sleep-text').innerText = "הגנת מסך פעילה";
            }).catch(e => console.log("Video failed", e));
        }

        function handleCardClick(p) {
            enableNoSleep(); // מפעיל הגנה בלחיצה ראשונה
            addPoint(p);
        }

        // --- זיהוי קולי ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.continuous = true;

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                document.getElementById('status').innerText = 'שמעתי: "' + transcript + '"';
                
                const name1 = document.querySelectorAll('.player-name')[0].innerText.trim().toLowerCase();
                const name2 = document.querySelectorAll('.player-name')[1].innerText.trim().toLowerCase();

                if (transcript.includes('ביטול') || transcript.includes('טעות')) undo();
                else if (transcript.includes(name1) || transcript.includes('כחול')) addPoint(1);
                else if (transcript.includes(name2) || transcript.includes('אדום')) addPoint(2);
            };
            recognition.onend = () => { if (isListening) recognition.start(); };
        }

        function toggleVoice() {
            enableNoSleep();
            if (!recognition) return alert("אין תמיכה בקול");
            if (!isListening) {
                recognition.start();
                isListening = true;
                document.getElementById('voice-btn').classList.add('active');
                document.getElementById('voice-text').innerText = "מקשיב...";
            } else {
                recognition.stop();
                isListening = false;
                document.getElementById('voice-btn').classList.remove('active');
                document.getElementById('voice-text').innerText = "הפעל שליטה קולית";
            }
        }

        function addPoint(player) {
            history.push({...state});
            if (player === 1) state.s1++; else state.s2++;
            updateUI();
            checkWin();
        }

        function undo() {
            if (history.length > 0) {
                state = history.pop();
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('score-1').innerText = state.s1;
            document.getElementById('score-2').innerText = state.s2;
            document.getElementById('sets-1').innerText = state.sets1;
            document.getElementById('sets-2').innerText = state.sets2;
            
            const total = state.s1 + state.s2;
            let server = (state.s1 >= 10 && state.s2 >= 10) ? (total % 2 === 0 ? 1 : 2) : (Math.floor(total / 2) % 2 === 0 ? 1 : 2);
            document.getElementById('card-1').classList.toggle('serving', server === 1);
            document.getElementById('card-2').classList.toggle('serving', server === 2);
        }

        function checkWin() {
            let win = (state.s1 >= 11 || state.s2 >= 11) && Math.abs(state.s1 - state.s2) >= 2;
            // ניצחון טכני 7-0
            if ((state.s1 === 7 && state.s2 === 0) || (state.s2 === 7 && state.s1 === 0)) win = true;

            if (win) {
                if (state.s1 > state.s2) state.sets1++; else state.sets2++;
                alert("המערכה נגמרה!");
                state.s1 = 0; state.s2 = 0;
                updateUI();
            }
        }

        function resetGame() {
            if(confirm("לאפס?")) {
                state = { s1: 0, s2: 0, sets1: 0, sets2: 0 };
                history = [];
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
