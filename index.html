<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Pro - Voice Elite Speed</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --p1-color: #3498db;
            --p2-color: #e74c3c;
            --accent: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        .container { text-align: center; width: 100%; max-width: 900px; padding: 10px; box-sizing: border-box; }

        .no-sleep-banner {
            background: #333;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center; gap: 8px; cursor: pointer; border: 1px solid #444;
        }
        .no-sleep-banner.active { border-color: var(--accent); color: var(--accent); }

        .voice-controls { margin-bottom: 15px; }

        #voice-btn {
            background: #444; color: white; border: none; padding: 12px 25px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        #voice-btn.active { background: #e74c3c; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .sets-header {
            display: flex;
            justify-content: center;
            gap: 100px;
            margin-bottom: 10px;
        }
        .set-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .set-label { font-size: 0.8rem; opacity: 0.7; margin-bottom: 2px; }
        .sets-count { font-size: 2rem; font-weight: bold; background: rgba(0,0,0,0.3); padding: 5px 20px; border-radius: 10px; transition: color 0.3s; }

        .scoreboard { 
            display: flex; gap: 15px; justify-content: center; width: 100%; 
        }
        .player-card { 
            background: var(--card-bg); padding: 25px 10px; border-radius: 20px; 
            flex: 1; max-width: 280px; border: 4px solid transparent; 
            cursor: pointer; display: flex; flex-direction: column; transition: 0.3s; 
        }
        .player-card.serving { border-color: var(--accent); transform: scale(1.05); }

        .player-name { font-size: 1.2rem; font-weight: bold; color: #eee; outline: none; margin-bottom: 5px; border-bottom: 1px dashed #555; }
        .score { font-size: clamp(4.5rem, 18vw, 11rem); font-weight: 900; line-height: 1; margin: 10px 0; font-family: monospace; pointer-events: none; transition: color 0.3s; }
        
        /* מחלקות דינמיות לצבעים */
        .color-p1 { color: var(--p1-color) !important; }
        .color-p2 { color: var(--p2-color) !important; }

        .controls { margin-top: 30px; display: flex; gap: 10px; justify-content: center; width: 100%; flex-wrap: wrap; }
        .action-btn { padding: 12px; font-size: 0.9rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; flex: 1; min-width: 100px; max-width: 150px; }
        .btn-undo { background: #444; color: white; }
        .btn-swap { background: #555; color: white; }
        .btn-reset { background: #c0392b; color: white; }

        .status-msg { margin-top: 10px; font-size: 0.85rem; color: #2ecc71; font-weight: bold; min-height: 1.2rem; }
        #hidden-canvas { display: none; }
    </style>
</head>
<body onclick="enableNoSleep()">

    <div class="container">
        <div id="no-sleep-btn" class="no-sleep-banner">
            <span id="no-sleep-icon">⭕</span>
            <span id="no-sleep-text">לחץ להפעלת הגנת מסך</span>
        </div>

        <div class="voice-controls">
            <button id="voice-btn" onclick="toggleVoice()">
                <span id="voice-icon">🎤</span>
                <span id="voice-text">הפעל שליטה קולית</span>
            </button>
            <div class="status-msg" id="status">מוכן...</div>
        </div>

        <div class="sets-header">
            <div class="set-box">
                <div class="set-label">מערכות ימין</div>
                <div class="sets-count" id="sets-display-1">0</div>
            </div>
            <div class="set-box">
                <div class="set-label">מערכות שמאל</div>
                <div class="sets-display-2" id="sets-display-2">0</div>
                <div class="sets-count" id="sets-display-2">0</div>
            </div>
        </div>

        <div class="scoreboard">
            <div class="player-card" id="ui-card-right" onclick="handleCardClick(1)">
                <div class="player-name" id="ui-name-right" contenteditable="true" onclick="event.stopPropagation()">כחול</div>
                <div class="score" id="ui-score-right">0</div>
            </div>
            <div class="player-card" id="ui-card-left" onclick="handleCardClick(2)">
                <div class="player-name" id="ui-name-left" contenteditable="true" onclick="event.stopPropagation()">אדום</div>
                <div class="score" id="ui-score-left">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="action-btn btn-undo" onclick="undo()">ביטול (חזור)</button>
            <button class="action-btn btn-swap" onclick="swapSides()">החלף צדדים</button>
            <button class="action-btn btn-reset" onclick="resetGame()">איפוס</button>
        </div>
    </div>

    <video id="no-sleep-video" playsinline muted loop style="display:none;"></video>
    <canvas id="hidden-canvas" width="10" height="10"></canvas>

    <script>
        // state מייצג את הקבוצות הלוגיות (1=כחול, 2=אדום)
        let state = { s1: 0, s2: 0, sets1: 0, sets2: 0 };
        let history = [];
        let isListening = false;
        let isNoSleepActive = false;
        let lastPointTime = 0;
        let isSwapped = false; // האם כחול (1) נמצא בשמאל כרגע?
        let wakeLock = null;
        let lastServer = 1;
        let isProcessing = false;

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'he-IL';
            utterance.rate = 1.4;
            window.speechSynthesis.speak(utterance);
        }

        function announceScore() {
            const name1 = document.getElementById('ui-name-right').innerText;
            const name2 = document.getElementById('ui-name-left').innerText;
            // תמיד מקריא לפי קבוצה 1 ואז 2 בלי קשר לצד
            let scoreText = "";
            if (state.s1 === state.s2) {
                scoreText = `${state.s1} ${state.s2} תיקו`;
            } else if (state.s1 > state.s2) {
                scoreText = `${state.s1} ${state.s2} כחול`;
            } else {
                scoreText = `${state.s2} ${state.s1} אדום`;
            }

            const currentServer = getCurrentServer();
            if (currentServer !== lastServer) {
                const serverName = currentServer === 1 ? "כחול" : "אדום";
                scoreText += `. הגשות ${serverName}`;
                lastServer = currentServer;
            }
            speak(scoreText);
        }

        function getCurrentServer() {
            const total = state.s1 + state.s2;
            if (state.s1 >= 10 && state.s2 >= 10) return (total % 2 === 0 ? 1 : 2);
            return (Math.floor(total / 2) % 2 === 0 ? 1 : 2);
        }

        function swapSides() {
            isSwapped = !isSwapped;
            updateUI();
            speak("החלפת צדדים");
        }

        function handleCardClick(uiSide) {
            enableNoSleep();
            // uiSide 1 = ימין, 2 = שמאל
            if (!isSwapped) {
                addPoint(uiSide === 1 ? 1 : 2);
            } else {
                addPoint(uiSide === 1 ? 2 : 1);
            }
        }

        function addPoint(player) {
            const now = Date.now();
            if (now - lastPointTime < 1500) return; 
            lastPointTime = now;

            history.push({...state});
            if (player === 1) state.s1++; else state.s2++;
            
            updateUI();
            if (!checkWin()) announceScore();
        }

        function updateUI() {
            const scoreRight = document.getElementById('ui-score-right');
            const scoreLeft = document.getElementById('ui-score-left');
            const cardRight = document.getElementById('ui-card-right');
            const cardLeft = document.getElementById('ui-card-left');
            const setsDisplay1 = document.getElementById('sets-display-1');
            const setsDisplay2 = document.getElementById('sets-display-2');

            // אם לא הוחלף: ימין=כחול(1), שמאל=אדום(2)
            if (!isSwapped) {
                scoreRight.innerText = state.s1;
                scoreLeft.innerText = state.s2;
                setsDisplay1.innerText = state.sets1;
                setsDisplay2.innerText = state.sets2;
                
                scoreRight.className = "score color-p1";
                scoreLeft.className = "score color-p2";
                setsDisplay1.className = "sets-count color-p1";
                setsDisplay2.className = "sets-count color-p2";
            } else {
                // אם הוחלף: ימין=אדום(2), שמאל=כחול(1)
                scoreRight.innerText = state.s2;
                scoreLeft.innerText = state.s1;
                setsDisplay1.innerText = state.sets2;
                setsDisplay2.innerText = state.sets1;

                scoreRight.className = "score color-p2";
                scoreLeft.className = "score color-p1";
                setsDisplay1.className = "sets-count color-p2";
                setsDisplay2.className = "sets-count color-p1";
            }
            
            const server = getCurrentServer();
            if (!isSwapped) {
                cardRight.classList.toggle('serving', server === 1);
                cardLeft.classList.toggle('serving', server === 2);
            } else {
                cardRight.classList.toggle('serving', server === 2);
                cardLeft.classList.toggle('serving', server === 1);
            }
        }

        function checkWin() {
            let winner = 0;
            let isTech = false;
            if (state.s1 >= 11 && (state.s1 - state.s2) >= 2) winner = 1;
            else if (state.s2 >= 11 && (state.s2 - state.s1) >= 2) winner = 2;
            else if (state.s1 === 7 && state.s2 === 0) { winner = 1; isTech = true; }
            else if (state.s2 === 7 && state.s1 === 0) { winner = 2; isTech = true; }

            if (winner > 0) {
                if (winner === 1) state.sets1++; else state.sets2++;
                const wName = (winner === 1) ? "כחול" : "אדום";
                
                if (isTech) speak(`טכני! פירקו אותם שבע אפס! ${wName} ניצח.`);
                else speak(`מערכה נגמרה. ${wName} ניצח.`);
                
                setTimeout(() => {
                    state.s1 = 0; state.s2 = 0;
                    lastServer = 1;
                    updateUI();
                }, 2000); 
                return true;
            }
            return false;
        }

        // --- Voice Control ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                if (isProcessing) return;
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript.trim().toLowerCase();
                    document.getElementById('status').innerText = 'שומע: ' + transcript;

                    if (transcript.match(/ביטול|חזור|טעות/)) {
                        triggerVoiceAction(() => undo()); break;
                    } 
                    if (transcript.match(/צדדים|החלף צד|תחליף צד|שנה צד/)) {
                        triggerVoiceAction(() => swapSides()); break;
                    }
                    if (transcript.match(/כחול|כחו|חול/)) {
                        triggerVoiceAction(() => addPoint(1)); break;
                    }
                    if (transcript.match(/אדום|אדו|דום/)) {
                        triggerVoiceAction(() => addPoint(2)); break;
                    }
                }
            };
            recognition.onend = () => { if (isListening) recognition.start(); };
        }

        function triggerVoiceAction(action) {
            isProcessing = true;
            action();
            recognition.stop();
            setTimeout(() => { isProcessing = false; }, 1600); 
        }

        function toggleVoice() {
            enableNoSleep();
            if (!recognition) return alert("אין תמיכה בקול");
            isListening = !isListening;
            if (isListening) {
                recognition.start();
                document.getElementById('voice-btn').classList.add('active');
            } else {
                recognition.stop();
                document.getElementById('voice-btn').classList.remove('active');
            }
        }

        async function enableNoSleep() {
            if (isNoSleepActive) return;
            const video = document.getElementById('no-sleep-video');
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            setInterval(() => { ctx.fillRect(0,0,1,1); }, 1000);
            const stream = canvas.captureStream(1);
            video.srcObject = stream;
            try {
                await video.play();
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
                isNoSleepActive = true;
                document.getElementById('no-sleep-btn').classList.add('active');
            } catch (e) {}
        }

        function undo() {
            if (history.length > 0) {
                state = history.pop();
                lastServer = getCurrentServer();
                updateUI();
                speak("ביטול");
                setTimeout(announceScore, 600);
            }
        }

        function resetGame() {
            if(confirm("לאפס את הניקוד?")) {
                state = { s1: 0, s2: 0, sets1: 0, sets2: 0 };
                history = [];
                lastServer = 1;
                updateUI();
                speak("המשחק מתאפס");
            }
        }

        updateUI();
    </script>
</body>
</html>
